# Spectrum source for the bar's meter; read only by cava, which the shell
# starts and stops with playback. 96 bands fill the player card's waveform
# at the meter's own pitch; the island takes a spread of them.
# services/Cava.qml must say the same.

[general]
bars = 96
framerate = 30
autosens = 1

[input]
method = pulse
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
bar_delimiter = 59
frame_delimiter = 10

[smoothing]
noise_reduction = 70
