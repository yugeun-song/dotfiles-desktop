# Read from the XDG config directory, where install.sh mirrors it.
#
# Native Wayland, not XWayland: under XWayland Spotify drew at scale 1 on the
# 1.5 panel (xwayland:force_zero_scaling) and took its pointer from XSETTINGS
# (breeze_cursors, served by KDE's gtkconfig then), never from XCURSOR_THEME.
# On Wayland the compositor scales it per output and draws the pointer
# (cursor-shape-v1). Its Chromium (146 in 2026-09) keeps the Wayland IME off
# unless told: the last two flags let fcitx5 type Hangul in the search field.
[spotify]
extra_arguments = ["--enable-features=UseOzonePlatform", "--ozone-platform=wayland",
                   "--enable-wayland-ime", "--wayland-text-input-version=3"]
