# spotify-launcher reads this from ~/.config; install.sh mirrors it there.
#
# Native Wayland rather than XWayland. Under XWayland Spotify drew at scale 1
# on the 1.5 panel (xwayland:force_zero_scaling leaves X clients unscaled) and
# took its pointer from the GTK XSETTINGS that KDE's gtkconfig serves
# (breeze_cursors), never from XCURSOR_THEME. On Wayland the compositor scales
# it per monitor and draws the pointer itself (cursor-shape-v1).
# Its Chromium (146 in 2026-09) leaves the Wayland IME off unless told, so the
# last two flags keep fcitx5, and with it Hangul, working in the search field.
[spotify]
extra_arguments = ["--enable-features=UseOzonePlatform", "--ozone-platform=wayland",
                   "--enable-wayland-ime", "--wayland-text-input-version=3"]
