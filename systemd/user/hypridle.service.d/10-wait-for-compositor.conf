# dotfiles-desktop
# The packaged unit can start before the Wayland socket exists ("Couldn't
# connect to a wayland compositor") and hit its start limit. hypridle answers
# `loginctl lock-session`, so with it dead Ctrl+Alt+L does nothing and the
# machine suspends unlocked, silently. Wait for the socket; no start limit.
[Unit]
After=hyprland-session.target
PartOf=hyprland-session.target
StartLimitIntervalSec=0

[Service]
# Up to 20 s. WAYLAND_DISPLAY comes from session-start.sh's environment import.
ExecStartPre=/bin/sh -c 'i=0; while [ $i -lt 100 ]; do [ -S "${XDG_RUNTIME_DIR}/${WAYLAND_DISPLAY}" ] && exit 0; i=$((i+1)); sleep 0.2; done; echo "no wayland socket after 20s" >&2; exit 1'
# always, not on-failure: see bar.service. Retries until the session ends.
Restart=always
RestartSec=2
