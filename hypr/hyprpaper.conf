# No image named here: a path in this file must exist when hyprpaper parses it
# (0.8.1+ refuses to start on a bad config), and an absolute home path is
# machine-specific. scripts/wallpaper.sh --reload (ExecStartPost of
# hyprpaper.service) sets it over IPC; hyprlock.conf reads the same file.

# Required: wallpaper.sh talks to hyprpaper over IPC.
ipc = on

splash = false
