# No image named here: hyprpaper expands neither ~ nor $HOME ("no target: no wp
# will be created"), and an absolute home path is machine-specific.
# scripts/wallpaper.sh --reload (ExecStartPost of hyprpaper.service) sets it
# over IPC; hyprlock.conf reads the same file.

# Required: wallpaper.sh talks to hyprpaper over IPC.
ipc = on

splash = false
