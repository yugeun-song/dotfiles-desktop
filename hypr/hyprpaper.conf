# Wallpaper.
#
# The image is not named here, and that is not an oversight. hyprpaper does not
# expand ~ or $HOME in its configuration: both were tried and both produced
# "Monitor HDMI-A-1 has no target: no wp will be created". The only thing it
# accepts is a literal absolute path, and writing this machine's home directory into a file
# that is meant to work on any machine is the wrong trade.
#
# So scripts/wallpaper.sh sets it over IPC at session start, with the path
# worked out at the time. That script is also what changes the wallpaper later,
# and hypr/hyprlock.conf reads the same file, so the desktop and the lock
# screen cannot drift apart.

# Required. Without it hyprctl cannot reach hyprpaper and nothing can set a
# wallpaper at all.
ipc = on

splash = false
