# No image named here: a path in this file must exist when hyprpaper parses
# it (0.8.1+ refuses a bad config), and a home path is machine-specific.
# scripts/wallpaper.sh --reload (hyprpaper.service's ExecStartPost) sets it
# over IPC; hyprlock.conf reads the same file.

# Required: wallpaper.sh talks to hyprpaper over IPC.
ipc = on

splash = false
