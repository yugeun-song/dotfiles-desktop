# Wallpaper.
#
# One path, set here and read again by hyprlock, so the desktop and the lock
# screen cannot drift apart. scripts/wallpaper.sh is what changes it; nothing
# else should edit this file.

preload = ~/.local/share/wallpapers/current.png
wallpaper = , ~/.local/share/wallpapers/current.png

# The image is decoded once and kept. Unloading it would mean decoding it
# again on every monitor hotplug, which is when the desktop is already busy.
ipc = on
splash = false
