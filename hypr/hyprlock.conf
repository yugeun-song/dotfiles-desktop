# Lock screen: black and white, time and a password field only. Anyone walking
# past can read it, so it shows no status (battery, media, weather).

# Sizes are for the reference output, the 2560x1440 desk monitor the bar and
# Hyprland's gaps are tuned on; $fit_reference declares it for
# scripts/lock-fit.sh, and hyprlock ignores it. hyprlock draws in each
# screen's own pixels and ignores the compositor scale, so a size takes a
# larger share of a screen with fewer pixels, and the desk monitor has fewer
# than the 2880x1800 panel. lock.sh therefore locks with lock-fit.sh's copy:
# every block once per output, its lengths scaled to keep the reference's
# share (x1.19 on the panel). Only numbers written here are scaled;
# percentages and hyprlock's defaults are not. The odd values are the sizes
# tuned on the panel (88 pt time, 300x52 field) divided by 1.19, rounded so
# the panel gets those back exactly.
$fit_reference = 2560x1440

# Only the small input-field animations run. The screen-sized fade stays off:
# it is the path the xe driver is least trusted with.
animations {
    enabled = true

    bezier = answer, 0.16, 1, 0.3, 1

    animation = fade, 0, 1, default

    animation = inputFieldDots, 1, 2, answer
    animation = inputFieldColors, 1, 3, linear
    animation = inputFieldWidth, 1, 3, answer
    animation = inputFieldFade, 0, 1, default
}

general {
    hide_cursor = true
    # An empty Enter is a slip, not a failed attempt.
    ignore_empty_input = true
    fail_timeout = 2000
}

background {
    monitor =
    path = ~/Pictures/Wallpapers/current.png
    # Fallback on a fresh install: the image is user state, not in the repo.
    color = rgba(000000ff)
    blur_passes = 3
    blur_size = 6
    brightness = 0.40
    contrast = 0.95
    # No vibrancy: this screen is meant to be colourless.
    vibrancy = 0.0
    vibrancy_darkness = 0.0
}

# Date over the clock. Day before month, matching the bar.
label {
    monitor =
    text = cmd[update:60000] date +"%a %-d %b"
    color = rgba(ffffffb3)
    font_size = 16
    font_family = Inter
    position = 0, 169
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgba(ffffffff)
    font_size = 74
    font_family = Inter SemiBold
    position = 0, 101
    halign = center
    valign = center
}

# fail_color stays white: $FAIL says what happened, and red would be the only
# colour on screen.
input-field {
    monitor =
    size = 253, 44
    font_family = Inter
    outline_thickness = 2
    dots_size = 0.24
    dots_spacing = 0.3
    dots_center = true
    dots_rounding = -1
    rounding = 12

    outer_color = rgba(ffffff59)
    inner_color = rgba(00000099)
    font_color = rgba(ffffffff)
    check_color = rgba(ffffffff)
    fail_color = rgba(ffffffff)
    capslock_color = rgba(ffffffff)

    placeholder_text = <span foreground="##ffffff66">password</span>
    fail_text = <span foreground="##ffffffcc">$FAIL</span>
    fade_on_empty = false

    position = 0, -17
    halign = center
    valign = center
}

label {
    monitor =
    # hyprlock has $USER but no $HOSTNAME variable.
    text = cmd[] echo "$(whoami)@$(hostname -s)"
    color = rgba(ffffff73)
    font_size = 12
    font_family = Inter
    position = 0, 34
    halign = center
    valign = bottom
}

label {
    monitor =
    text = $LAYOUT
    color = rgba(ffffff73)
    font_size = 11
    font_family = Inter
    position = -25, 25
    halign = right
    valign = bottom
}
