# Lock screen.
#
# Black and white, and almost empty. It carried the battery, a headset's
# charge, the weather, and whatever was playing with cover art and working
# transport buttons; all of it is gone. A lock screen is looked at by whoever
# walks past the machine, and every reading on it was something told to them
# rather than to the person who owns it. What is left is the time and a place
# to type.
#
# Nothing here reads anything, so scripts/lock-status.sh and
# scripts/lock-media.sh went with it.
#
# There was a notch at the top edge with a lock glyph in it, copied from the
# bar's own centre. It was one more object on a screen whose whole argument is
# that it has none, and the lock it drew said what the password field already
# says.

# Only the input field animates, and only the parts of it that are small.
#
# The block used to be `enabled = false` outright, because the screen-sized
# fade is the path this machine's xe driver is least trusted with. That reason
# holds for `fade` and for nothing else: the dots and the field's own colours
# are a few hundred pixels and are what make typing a password feel answered.
animations {
    enabled = true

    # Fast out of the gate and settling, so a keystroke registers immediately
    # and the dot arrives without a bounce.
    bezier = answer, 0.16, 1, 0.3, 1

    # The one that was distrusted. Off.
    animation = fade, 0, 1, default

    # A dot per character, growing in.
    animation = inputFieldDots, 1, 2, answer
    # The field's own colours, for the check and fail states.
    animation = inputFieldColors, 1, 3, linear
    # It widens as it fills.
    animation = inputFieldWidth, 1, 3, answer
    animation = inputFieldFade, 0, 1, default
}

general {
    hide_cursor = true
    # An empty Enter is a slip, not an attempt, and counting it towards the
    # failure delay punishes the slip.
    ignore_empty_input = true
    fail_timeout = 2000
}

background {
    monitor =
    path = ~/Pictures/Wallpapers/current.png
    # Used when the path above is missing, which is every fresh install: the
    # image is user state and is deliberately not in this repository.
    color = rgba(000000ff)
    blur_passes = 3
    blur_size = 7
    brightness = 0.40
    contrast = 0.95
    # No vibrancy. It exists to keep colour alive through the blur, and this
    # screen does not want colour kept alive.
    vibrancy = 0.0
    vibrancy_darkness = 0.0
}

# Date over the clock. Day before month, matching the bar.
label {
    monitor =
    text = cmd[update:60000] date +"%a %-d %b"
    color = rgba(ffffffb3)
    font_size = 19
    font_family = Inter
    position = 0, 200
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgba(ffffffff)
    font_size = 88
    font_family = Inter SemiBold
    position = 0, 120
    halign = center
    valign = center
}

# One accent-free field. fail_color stays white too: the message under it says
# what happened, and a red ring would be the only colour on the screen.
input-field {
    monitor =
    size = 300, 52
    font_family = Inter
    outline_thickness = 2
    dots_size = 0.24
    dots_spacing = 0.3
    dots_center = true
    dots_rounding = -1
    rounding = 14

    outer_color = rgba(ffffff59)
    inner_color = rgba(00000099)
    font_color = rgba(ffffffff)
    check_color = rgba(ffffffff)
    fail_color = rgba(ffffffff)
    capslock_color = rgba(ffffffff)

    placeholder_text = <span foreground="##ffffff66">password</span>
    fail_text = <span foreground="##ffffffcc">$FAIL</span>
    fade_on_empty = false

    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    # hyprlock substitutes $USER but has no $HOSTNAME, so the host comes from
    # a command rather than a variable that would print itself.
    text = cmd[] echo "$(whoami)@$(hostname -s)"
    color = rgba(ffffff73)
    font_size = 14
    font_family = Inter
    position = 0, 40
    halign = center
    valign = bottom
}

label {
    monitor =
    text = $LAYOUT
    color = rgba(ffffff73)
    font_size = 13
    font_family = Inter
    position = -30, 30
    halign = right
    valign = bottom
}
