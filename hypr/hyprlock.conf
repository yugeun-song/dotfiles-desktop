# Lock screen.
#
# The background is the same file the desktop uses, blurred and dimmed. The
# point is recognition: what you see when the screen locks should obviously
# be your machine, not a stranger's login prompt.

# Animations off. An absent block defaults to enabled, and the fade path
# this machine would take is the one the xe driver is least trusted with.
animations {
    enabled = false
}

general {
    hide_cursor = true
    # An empty Enter is a slip, not an attempt, and counting it towards the
    # failure delay punishes the slip.
    ignore_empty_input = true
    fail_timeout = 2000
}

background {
    monitor =
    path = ~/Pictures/Wallpapers/current.png
    # Used when the path above is missing, which is every fresh install:
    # the image is user state and is deliberately not in this repository.
    color = rgba(1b1c36ff)
    blur_passes = 3
    blur_size = 7
    brightness = 0.45
    contrast = 0.95
    vibrancy = 0.15
    vibrancy_darkness = 0.1
}

input-field {
    monitor =
    size = 300, 52
    font_family = Inter
    outline_thickness = 2
    dots_size = 0.24
    dots_spacing = 0.3
    dots_center = true
    rounding = 14

    outer_color = rgba(686f9aff)
    inner_color = rgba(1b1c36cc)
    font_color = rgba(ecf0c1ff)
    check_color = rgba(7dcfffff)
    fail_color = rgba(f7768eff)
    capslock_color = rgba(f2ce00ff)

    placeholder_text = <span foreground="##686f9a">password</span>
    fail_text = <span foreground="##f7768e">$FAIL</span>
    fade_on_empty = false

    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgba(ecf0c1ff)
    font_size = 88
    font_family = Inter SemiBold
    position = 0, 180
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %-d %B"
    color = rgba(c0caf5ff)
    font_size = 18
    font_family = Inter
    position = 0, 110
    halign = center
    valign = center
}

label {
    monitor =
    # hyprlock substitutes $USER but has no $HOSTNAME, so the host comes
    # from a command rather than a variable that would print itself.
    text = cmd[] echo "$(whoami)@$(hostname -s)"
    color = rgba(686f9aff)
    font_size = 14
    font_family = Inter
    position = 0, 40
    halign = center
    valign = bottom
}

label {
    monitor =
    text = $LAYOUT
    color = rgba(686f9aff)
    font_size = 13
    font_family = Inter
    position = -30, 30
    halign = right
    valign = bottom
}
