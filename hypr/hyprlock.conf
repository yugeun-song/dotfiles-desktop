# Lock screen after the user's design (2026-10-24): an island with the lock,
# the date over a large clock, the weather, the playing track as a card with
# its transport, "Press to unlock" at the foot. The track and the weather
# show to anyone walking past, the user's choice over a time-only screen. The
# pointer stays: the transport takes clicks.

# Sizes are the design's: lengths on its 1183 px picture times 2.164 (its
# width to the 2560x1440 desk monitor's), offsets from its middle. The user
# chose the 2880x1800 panel's proportions (2026-10-24), then everything
# smaller with the gaps no wider (2026-10-25): the panel draws 0.854 of these
# numbers, and below the clock the groups sit closer than the design's.
# hyprlock draws in each screen's pixels and ignores the compositor scale, so
# lock.sh locks with scripts/lock-fit.sh's copy: every block once per output,
# text and heights scaled by the screen's height, widths and sideways offsets
# by its width. Only numbers written here scale, not percentages, sizes in
# markup or hyprlock's defaults. lock-fit.sh alone reads the two below.
# Blocks marked "fit: even" scale their widths as their heights, unstretched:
# the card and its controls keep the bar's grown island's proportions.
$fit_reference = 2880x1800
$fit_scale = 0.854

# Text colours per screen, from the wallpaper behind each group
# (scripts/lock-colours.py, run by lock-fit.sh): the bar's beige, the user's
# default, wherever it reads; else a deep tone of the hue opposite the
# wallpaper's, with a soft halo of the other tone (halo, glow) where its
# colour still does not read. Groups: head (date and clock), weather (alone:
# under a dark tower in a light sky even a halo left its small type unread),
# card (its picture, transport included), foot (the field). Here the beige
# with no halo, for this file as written.
$head_ink = rgba(ecf0c1ff)
$head_halo = 0
$head_glow = rgba(000000a6)
$weather_ink = rgba(ecf0c1ff)
$weather_halo = 0
$weather_glow = rgba(000000a6)
# The card's ink, pane and edge, in the form lock-media.py draws it with.
$card_paint = ecf0c1,ffffff1a,ffffff33
$foot_ink = rgba(ecf0c1ff)
$foot_hex = ecf0c1
$foot_halo = 0
$foot_glow = rgba(000000a6)

# Through python3: the installer marks only the .sh scripts executable.
$media = python3 ~/.config/hypr/scripts/lock-media.py

# The lock fades in over a capture of the desktop, as the user asked
# (2026-10-26; the screen-sized fade had been off as a precaution for the xe
# driver, never a measured fault). It does not fade out: the session is let
# go at once, and the bar sweeps the lock screen up off the desktop
# (quickshell/bar/modules/UnlockSweep.qml), as a phone's.
animations {
    enabled = true

    bezier = answer, 0.16, 1, 0.3, 1
    bezier = settle, 0.25, 1, 0.5, 1

    animation = fadeIn, 1, 3, settle
    animation = fadeOut, 0, 1, default

    animation = inputFieldDots, 1, 2, answer
    animation = inputFieldColors, 1, 3, linear
    animation = inputFieldWidth, 1, 3, answer
    animation = inputFieldFade, 0, 1, default
}

general {
    hide_cursor = false
    # An empty Enter is a slip, not a failed attempt.
    ignore_empty_input = true
    fail_timeout = 2000
}

# The wallpaper dimmed a little, as in the look the user chose.
# lock-colours.py follows the path, blur and brightness here, nothing else.
background {
    monitor =
    path = ~/Pictures/Wallpapers/current.png
    # Fallback on a fresh install: the image is user state, not in the repo.
    color = rgba(000000ff)
    # Blurred more and darker on a screen where fine detail lies behind the
    # text (lock-colours.py's BUSY_PASSES and darkened()).
    blur_passes = 1
    blur_size = 3
    brightness = 0.85
    contrast = 1.0
    vibrancy = 0.15
    vibrancy_darkness = 0.0
}

# The island in the bar's colour (Theme.qml menuBarBg, the user's call,
# 2026-10-24; the bar's own island is black since 2026-10-26), 250 x 60 of
# the design's 402 x 87 as the user asked (2026-10-25). The lock sits at its
# left end, as far in as from the top and bottom: move it with the island.
# Placed from the screen's top, so it keeps to the edge on a taller screen;
# the lock is above it by zindex.
shape {
    monitor =
    size = 250, 60
    color = rgba(0f111bff)
    rounding = 18
    border_size = 0
    position = 0, -18
    halign = center
    valign = top
}

label {
    monitor =
    text = cmd[] $media glyph lock
    color = rgba(ecf0c1ff)
    zindex = 1
    font_size = 21
    font_family = CaskaydiaCove Nerd Font Mono
    position = -97, -32
    halign = center
    valign = top
}

# Text at four fifths of the design's size, shapes at its own: the user found
# the text too large on the laptop (2026-10-24). The date and the weather keep
# to the clock in that measure.

# Date over the clock, day before month as on the bar.
label {
    monitor =
    text = cmd[update:60000] date +"%a, %-d %b"
    color = $head_ink
    font_size = 38
    shadow_passes = $head_halo
    shadow_size = 7
    shadow_color = $head_glow
    shadow_boost = 1.0
    font_family = Inter SemiBold
    position = 0, 380
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = $head_ink
    font_size = 125
    shadow_passes = $head_halo
    shadow_size = 7
    shadow_color = $head_glow
    shadow_boost = 1.0
    font_family = Inter Bold
    position = 0, 273
    halign = center
    valign = center
}

# The bar's weather, from its cache. The design's sleep mode beside it has
# no counterpart here and is left out.
label {
    monitor =
    text = cmd[update:600000] $media weather
    color = $weather_ink
    font_size = 22
    shadow_passes = $weather_halo
    shadow_size = 7
    shadow_color = $weather_glow
    shadow_boost = 1.0
    font_family = Inter SemiBold
    position = 0, 142
    halign = center
    valign = center
}

# The card: the bar's grown island at 1.6 times, its proportions and not its
# size, laid out alike (the user, 2026-10-26): cover, title and artist, the
# transport with play-pause on a disc, the position. lock-media.py draws it
# whole, since a label is placed by its middle and the title starts at the
# cover's edge. A transparent picture while nothing plays. size is the
# picture's shorter side, lock-media.py's H; the top stays where the taller
# card's was, under the weather.
image {
    monitor =
    # fit: even
    path = ~/.config/hypr/lock-blank.png
    reload_cmd = $media card $card_paint
    reload_time = 1
    size = 259
    rounding = 0
    border_size = 0
    position = 0, -72
    halign = center
    valign = center
}

# The transport's clicks: over each control the card draws, a transparent
# picture the size of its cell, at lock-media.py's CONTROL_X and CONTROL_Y
# from the card's middle. Pictures run nothing until clicked, where the
# glyph labels before them each ran a command every second. Repeat stands in
# for the design's output picker, as on the bar's island.
image {
    monitor =
    # fit: even
    path = ~/.config/hypr/lock-blank.png
    size = 58
    rounding = 0
    border_size = 0
    onclick = $media click shuffle
    position = -163, -106
    halign = center
    valign = center
}

image {
    monitor =
    # fit: even
    path = ~/.config/hypr/lock-blank.png
    size = 58
    rounding = 0
    border_size = 0
    onclick = $media click prev
    position = -83, -106
    halign = center
    valign = center
}

image {
    monitor =
    # fit: even
    path = ~/.config/hypr/lock-blank.png
    size = 58
    rounding = 0
    border_size = 0
    onclick = $media click toggle
    position = 0, -106
    halign = center
    valign = center
}

image {
    monitor =
    # fit: even
    path = ~/.config/hypr/lock-blank.png
    size = 58
    rounding = 0
    border_size = 0
    onclick = $media click next
    position = 83, -106
    halign = center
    valign = center
}

image {
    monitor =
    # fit: even
    path = ~/.config/hypr/lock-blank.png
    size = 58
    rounding = 0
    border_size = 0
    onclick = $media click loop
    position = 163, -106
    halign = center
    valign = center
}

# "Press to unlock" is the field's own placeholder, on no field: typing puts
# the dots where the words were, and after a wrong password fail_text ($FAIL)
# says what happened in the same place.
input-field {
    monitor =
    # hyprlock sizes the field's text from its height, not from markup: 96
    # draws the words at four fifths of the design's, as the rest of the
    # text, and the dots with them.
    size = 520, 96
    font_family = Inter SemiBold
    outline_thickness = 0
    dots_size = 0.13
    dots_spacing = 0.35
    dots_center = true
    dots_rounding = -1
    rounding = 0

    outer_color = rgba(00000000)
    inner_color = rgba(00000000)
    font_color = $foot_ink
    # Clear, as the field is: with no outline hyprlock 0.9.6 paints the
    # checking, failed and Caps Lock states into the field's fill, a square in
    # the words' colour after a wrong password that hid fail_text, set in the
    # same colour (the user, 2026-10-29). swap_font_color would send them to
    # the text instead, but in 0.9.6 it asks for the prompt again on every
    # frame and each ask schedules a redraw, so the lock never idles.
    check_color = rgba(00000000)
    fail_color = rgba(00000000)
    capslock_color = rgba(00000000)

    # No halo: hyprlock shadows the field's whole box, not its words, and a
    # pale box stood where the password goes; the user wanted none there
    # (2026-10-26).
    shadow_passes = 0

    placeholder_text = <span foreground="##$foot_hex">Press to unlock</span>
    fail_text = <span foreground="##$foot_hex">$FAIL</span>
    fade_on_empty = false

    position = 0, -282
    halign = center
    valign = center
}
