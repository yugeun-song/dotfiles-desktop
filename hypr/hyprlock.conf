# Lock screen.
#
# The background is the desktop's wallpaper, blurred and dimmed: what you see
# when the screen locks should obviously be your machine.
#
# The layout follows the bar's -- a notch-shaped island at the top edge, the
# clock under it, and the media widget near the bottom. Everything live comes
# from scripts/lock-status.sh and scripts/lock-media.sh, because hyprlock has
# no widget that reads anything; a label runs a command and draws what it
# prints, and onclick spawns one.

# Animations off. An absent block defaults to enabled, and the fade path this
# machine would take is the one the xe driver is least trusted with.
animations {
    enabled = false
}

general {
    hide_cursor = true
    # An empty Enter is a slip, not an attempt, and counting it towards the
    # failure delay punishes the slip.
    ignore_empty_input = true
    fail_timeout = 2000
}

background {
    monitor =
    path = ~/Pictures/Wallpapers/current.png
    # Used when the path above is missing, which is every fresh install: the
    # image is user state and is deliberately not in this repository.
    color = rgba(1b1c36ff)
    blur_passes = 3
    blur_size = 7
    brightness = 0.45
    contrast = 0.95
    vibrancy = 0.15
    vibrancy_darkness = 0.1
}

# ---------------------------------------------------------------------------
# The island.
# ---------------------------------------------------------------------------
# Pushed up by its own rounding so the top corners fall off the screen edge and
# only the bottom two are drawn -- the same trick Island.qml does by clipping.
# Pure black on purpose: it should read as a notch, not as a panel.
shape {
    monitor =
    size = 210, 34
    color = rgba(000000ff)
    rounding = 17
    position = 0, 17
    halign = center
    valign = top
}

label {
    monitor =
    text = 󰌾
    color = rgba(ecf0c1ff)
    font_size = 13
    font_family = CaskaydiaCove Nerd Font Mono
    position = 0, -7
    halign = center
    valign = top
}

# ---------------------------------------------------------------------------
# Time.
# ---------------------------------------------------------------------------
# Date above the clock, which is the order the reference has and the opposite
# of what this file used to do. Day before month, matching the bar.
label {
    monitor =
    text = cmd[update:60000] date +"%a %-d %b"
    color = rgba(c0caf5ff)
    font_size = 19
    font_family = Inter
    position = 0, 215
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgba(ecf0c1ff)
    font_size = 84
    font_family = Inter SemiBold
    position = 0, 140
    halign = center
    valign = center
}

# Battery, headset battery, temperature, today's range. One process a minute.
label {
    monitor =
    text = cmd[update:60000] ~/.config/hypr/scripts/lock-status.sh
    color = rgba(c0caf5cc)
    font_size = 15
    font_family = CaskaydiaCove Nerd Font Mono
    position = 0, 70
    halign = center
    valign = center
}

# ---------------------------------------------------------------------------
# Password.
# ---------------------------------------------------------------------------
input-field {
    monitor =
    size = 300, 52
    font_family = Inter
    outline_thickness = 2
    dots_size = 0.24
    dots_spacing = 0.3
    dots_center = true
    rounding = 14

    outer_color = rgba(686f9aff)
    inner_color = rgba(1b1c36cc)
    font_color = rgba(ecf0c1ff)
    check_color = rgba(7dcfffff)
    fail_color = rgba(f7768eff)
    capslock_color = rgba(f2ce00ff)

    placeholder_text = <span foreground="##686f9a">password</span>
    fail_text = <span foreground="##f7768e">$FAIL</span>
    fade_on_empty = false

    position = 0, -20
    halign = center
    valign = center
}

# ---------------------------------------------------------------------------
# Media.
# ---------------------------------------------------------------------------
# No background card behind these. A shape is drawn whether or not there is
# anything to put on it, and a label with no text draws nothing -- so with the
# card the screen would carry an empty panel whenever nothing was playing, and
# without it the whole widget appears and disappears on its own.
#
# The art is a cache lock-media.sh writes from local files only; see the note
# there about why a remote artUrl is never fetched. scripts/lock.sh clears it
# before the screen opens so no stale cover survives into the next lock.
image {
    monitor =
    path = ~/.cache/hyprlock/art
    size = 58
    rounding = 8
    border_size = 0
    reload_time = 5
    reload_cmd = ~/.config/hypr/scripts/lock-media.sh --art
    position = -150, 150
    halign = center
    valign = bottom
}

label {
    monitor =
    text = cmd[update:5000] ~/.config/hypr/scripts/lock-media.sh --line
    color = rgba(ecf0c1ff)
    font_size = 15
    font_family = Inter
    position = 40, 168
    halign = center
    valign = bottom
}

# The transport. hyprlock spawns onclick, so these are real buttons rather
# than decoration -- the one place its widget set does more than draw.
label {
    monitor =
    text = 󰒮
    color = rgba(ecf0c1cc)
    font_size = 19
    font_family = CaskaydiaCove Nerd Font Mono
    onclick = ~/.config/hypr/scripts/lock-media.sh --previous
    position = -20, 126
    halign = center
    valign = bottom
}

label {
    monitor =
    text = cmd[update:2000] ~/.config/hypr/scripts/lock-media.sh --playing
    color = rgba(ecf0c1ff)
    font_size = 21
    font_family = CaskaydiaCove Nerd Font Mono
    onclick = ~/.config/hypr/scripts/lock-media.sh --toggle
    position = 40, 126
    halign = center
    valign = bottom
}

label {
    monitor =
    text = 󰒭
    color = rgba(ecf0c1cc)
    font_size = 19
    font_family = CaskaydiaCove Nerd Font Mono
    onclick = ~/.config/hypr/scripts/lock-media.sh --next
    position = 100, 126
    halign = center
    valign = bottom
}

# ---------------------------------------------------------------------------
# Identity.
# ---------------------------------------------------------------------------
label {
    monitor =
    # hyprlock substitutes $USER but has no $HOSTNAME, so the host comes from
    # a command rather than a variable that would print itself.
    text = cmd[] echo "$(whoami)@$(hostname -s)"
    color = rgba(686f9aff)
    font_size = 14
    font_family = Inter
    position = 0, 40
    halign = center
    valign = bottom
}

label {
    monitor =
    text = $LAYOUT
    color = rgba(686f9aff)
    font_size = 13
    font_family = Inter
    position = -30, 30
    halign = right
    valign = bottom
}
