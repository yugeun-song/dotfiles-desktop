# No idle timers on purpose: long-running jobs must not be blanked or suspended.
# hypridle still runs to lock before a requested suspend, to answer
# `loginctl lock-session` and to tell the bar when the session locks and
# unlocks (see on_lock_cmd below); without it a suspend resumes unlocked.

# after_sleep: the monitor policy re-lights the screens from the lid's state,
# not a blanket DPMS enable, which lit the panel inside a shut lid and re-armed
# the compositor-wide DPMS state the lid code keeps off beside an external.
# The fallback is the old blanket enable, for a config where the policy module
# failed to load.
# on_lock_cmd and on_unlock_cmd: the bar's key overlay reads evdev, so it
# reads the password typed into hyprlock as well, and drew its last keys the
# moment the session unlocked. The bar drops every key between the two. These
# come from the compositor's lock notifier, so a crashed hyprlock, after which
# the session stays locked, is not taken for an unlock; lock.sh sends the
# lock half earlier. With no bar running, qs answers "Target not found".
general {
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl eval 'if MONITORS then MONITORS.resume() else hl.dispatch(hl.dsp.dpms({ action = "enable" })) end'
    lock_cmd = pidof hyprlock || ~/.config/hypr/scripts/lock.sh
    on_lock_cmd = qs -p ~/.config/quickshell/bar ipc call keys lock
    on_unlock_cmd = qs -p ~/.config/quickshell/bar ipc call keys unlock
    inhibit_sleep = 3
}

# hypridle errors on a config with no listener; this one is unreachable (1 year).
listener {
    timeout = 31536000
    on-timeout = true
}
