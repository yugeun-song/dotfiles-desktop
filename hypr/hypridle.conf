# No idle timers on purpose: long-running jobs must not be blanked or suspended.
# hypridle still runs to lock before a requested suspend and to answer
# `loginctl lock-session`; without it a suspend resumes unlocked.

general {
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
    lock_cmd = pidof hyprlock || ~/.config/hypr/scripts/lock.sh
    inhibit_sleep = 3
}

# hypridle errors on a config with no listener; this one is unreachable (1 year).
listener {
    timeout = 31536000
    on-timeout = true
}
