# Idle handling: none.
#
# There are no listeners here on purpose. Nothing locks, blanks or suspends
# because time passed. A long-running job is a normal way to use this machine,
# and a screen that goes dark or a machine that suspends underneath one is a
# failure, not a power saving.
#
# hypridle still runs, for the two things that are not timers: locking before
# a suspend that was actually asked for, and putting the lock screen back in
# focus on the way out. Remove hypridle entirely and a deliberate suspend
# resumes to an unlocked desktop.

general {
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
    lock_cmd = pidof hyprlock || hyprlock
    inhibit_sleep = 3
}

# hypridle refuses a configuration with no rules at all and prints an error
# on every start. This is that rule, and it is deliberately unreachable: a
# year of continuous idleness, and nothing to do when it arrives.
listener {
    timeout = 31536000
    on-timeout = true
}
