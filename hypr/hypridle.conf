# No idle timers on purpose: long-running jobs must not be blanked or
# suspended. hypridle still runs to lock before a requested suspend (without
# it a suspend resumes unlocked), to answer `loginctl lock-session` and to
# tell the bar about locks and unlocks.

# after_sleep: the monitor policy re-lights the screens from the lid's state.
# A blanket DPMS enable lit the panel inside a shut lid and re-armed the DPMS
# state the lid code keeps off beside an external; it stays only as the
# fallback for a config whose policy module failed to load.
# on_lock_cmd/on_unlock_cmd: the key overlay reads evdev, so it would show the
# password typed into hyprlock; the bar drops every key between the two. They
# come from the compositor's lock notifier, so a crashed hyprlock (the session
# stays locked) is not taken for an unlock; lock.sh sends the lock half
# earlier. With no bar running, qs answers "Target not found".
# hyprlang expands $HOME while parsing and leaves ${...} to the shell, which
# picks XDG_CONFIG_HOME when the session sets one.
general {
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl eval 'if MONITORS then MONITORS.resume() else hl.dispatch(hl.dsp.dpms({ action = "enable" })) end'
    lock_cmd = pidof hyprlock || "${XDG_CONFIG_HOME:-$HOME/.config}/hypr/scripts/lock.sh"
    on_lock_cmd = qs -p "${XDG_CONFIG_HOME:-$HOME/.config}/quickshell/bar" ipc call keys lock
    on_unlock_cmd = qs -p "${XDG_CONFIG_HOME:-$HOME/.config}/quickshell/bar" ipc call keys unlock
    inhibit_sleep = 3
}

# hypridle errors on a config with no listener; this one is unreachable (1 year).
listener {
    timeout = 31536000
    on-timeout = true
}
