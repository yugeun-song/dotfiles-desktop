[Settings]
gtk-application-prefer-dark-theme=true
gtk-cursor-blink=true
gtk-cursor-blink-time=1000

# No gtk-cursor-theme-name or -size here on purpose.
#
# A value in this file is a second answer to a question three other things
# already answer, and it was the wrong one: it named breeze_cursors at 24 while
# the compositor, the XCursor clients and gsettings all used Spaceduck-Sky at
# whatever size env.lua had been given. The pointer changed size on the way into
# a GTK window and back on the way out. With the keys gone GTK falls back to XCURSOR_THEME and XCURSOR_SIZE,
# which hypr/config/env.lua sets for every child of the session, so all four
# consumers now read the one place the cursor is chosen.
gtk-decoration-layout=icon:minimize,maximize,close
gtk-enable-animations=true
gtk-font-name=Inter 11
gtk-icon-theme-name=breeze-dark
gtk-primary-button-warps-slider=true
gtk-sound-theme-name=freedesktop
gtk-xft-dpi=157286
gtk-theme-name=Breeze-Dark
