[Settings]
gtk-application-prefer-dark-theme=true
gtk-button-images=true
gtk-cursor-blink=true
gtk-cursor-blink-time=1000

# No gtk-cursor-theme-name or -size here on purpose.
#
# A value here is a second answer to a question three other things already
# answer, and it was the wrong one: breeze_cursors at 24 while the compositor,
# the XCursor clients and gsettings all used Spaceduck-Sky at the size
# hypr/config/env.lua had been given.
#
# Two things about that are worth knowing before anyone puts them back.
#
# This file does not stay as it is written. kde-gtk-config ships a KDED module
# that generates GTK settings from kdeglobals, and it restores both keys. The
# giveaway is the font line: it comes back as "Inter,  11", KDE's family-comma-
# size form, rather than the "Inter 11" written here.
#
# And it does not matter, because on Wayland GTK does not read this file. It
# asks xdg-desktop-portal, which answers from dconf, which is what
# hypr/scripts/gsettings-apply.sh writes from XCURSOR_THEME and XCURSOR_SIZE.
# Measured rather than assumed: the portal answers Spaceduck-Sky and 24 while
# this file says breeze_cursors. Section 10.8 of the settings repository has the
# rest of that path.
#
# So the keys stay out as a statement of what this repository asks for, and the
# thing that actually decides is env.lua.
gtk-decoration-layout=icon:minimize,maximize,close
gtk-enable-animations=true
gtk-font-name=Inter 11
gtk-icon-theme-name=breeze-dark
gtk-menu-images=true
gtk-modules=colorreload-gtk-module:window-decorations-gtk-module
gtk-primary-button-warps-slider=true
gtk-sound-theme-name=freedesktop
gtk-theme-name=Breeze-Dark
gtk-toolbar-style=3
gtk-xft-dpi=157286
