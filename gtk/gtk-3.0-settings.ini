[Settings]
gtk-application-prefer-dark-theme=true
gtk-button-images=true
gtk-cursor-blink=true
gtk-cursor-blink-time=1000

# No cursor theme or size on purpose: hypr/config/env.lua is the one source,
# and on Wayland GTK takes the cursor from the portal (dconf, set by
# hypr/scripts/gsettings-apply.sh). If they reappear, or the font turns into
# "Inter,  11", KDE's gtkconfig is rewriting this file (kde/kded5rc stops it).
gtk-decoration-layout=icon:minimize,maximize,close
gtk-enable-animations=true
gtk-font-name=Inter 11
gtk-icon-theme-name=breeze-dark
gtk-menu-images=true
gtk-modules=colorreload-gtk-module:window-decorations-gtk-module
gtk-primary-button-warps-slider=true
gtk-sound-theme-name=freedesktop
gtk-theme-name=Breeze-Dark
gtk-toolbar-style=3
gtk-xft-dpi=157286
