<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>

  <!--
    Font chain for this machine.

    Inter carries Latin UI text and has no Hangul at all (verified: 0 of
    11172 Hangul syllables), so Pretendard sits directly behind it and picks
    up Korean per glyph. Noto Sans catches everything neither covers.

    Order inside <prefer> is the fallback order. Listing Inter first does not
    hide Pretendard: fontconfig falls through per character, not per string.

    Note on family names: the Inter variable font registers as "Inter
    Variable", not "Inter". Only the static instances shipped by the
    inter-font package use the family name "Inter", which is what this file
    asks for.
  -->

  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Inter</family>
      <family>Pretendard</family>
      <family>Noto Sans</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

  <alias>
    <family>serif</family>
    <prefer>
      <family>Noto Serif</family>
      <family>Pretendard</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

  <!--
    Monospace keeps the Nerd Font first so terminal glyphs and the status bar
    icons resolve. Pretendard follows for Hangul, which is what the kitty
    symbol_map does by hand for that one application.
  -->
  <alias>
    <family>monospace</family>
    <prefer>
      <family>CaskaydiaCove Nerd Font Mono</family>
      <family>Pretendard</family>
      <family>Noto Sans Mono</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

  <!-- Emoji requests should never land on a text-only font. -->
  <alias>
    <family>emoji</family>
    <prefer><family>Noto Color Emoji</family></prefer>
  </alias>

</fontconfig>
