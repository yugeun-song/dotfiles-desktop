<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>

  <!--
    Inter has no Hangul; fontconfig falls back per character to Pretendard.
    "Inter" is the static family; the variable font is named "Inter Variable".
  -->

  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Inter</family>
      <family>Pretendard</family>
      <family>Noto Sans</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

  <alias>
    <family>serif</family>
    <prefer>
      <family>Noto Serif</family>
      <family>Pretendard</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

  <!-- Nerd Font first: plain monospace keeps the icon glyphs (the bar and kitty
       name the font themselves); Pretendard for Hangul. -->
  <alias>
    <family>monospace</family>
    <prefer>
      <family>CaskaydiaCove Nerd Font Mono</family>
      <family>Pretendard</family>
      <family>Noto Sans Mono</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

  <alias>
    <family>emoji</family>
    <prefer><family>Noto Color Emoji</family></prefer>
  </alias>

</fontconfig>
