<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>

  <!--
    Inter has no Hangul, so Pretendard behind it supplies Korean; fontconfig
    falls back per character. "Inter" is the static inter-font family; the
    variable font registers as "Inter Variable".
  -->

  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Inter</family>
      <family>Pretendard</family>
      <family>Noto Sans</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

  <alias>
    <family>serif</family>
    <prefer>
      <family>Noto Serif</family>
      <family>Pretendard</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

  <!-- Nerd Font first for terminal and bar icons; Pretendard for Hangul. -->
  <alias>
    <family>monospace</family>
    <prefer>
      <family>CaskaydiaCove Nerd Font Mono</family>
      <family>Pretendard</family>
      <family>Noto Sans Mono</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

  <alias>
    <family>emoji</family>
    <prefer><family>Noto Color Emoji</family></prefer>
  </alias>

</fontconfig>
